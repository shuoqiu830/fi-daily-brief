name: FI Daily Brief

on:
  schedule:
    # 11:00 UTC = 7am EDT (summer). ~6am EST (winter). Always runs once per day.
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secret
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Run FI Daily Brief
        run: python main.py

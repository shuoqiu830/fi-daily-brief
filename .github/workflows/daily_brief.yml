name: FI Daily Brief

on:
  workflow_dispatch:
    # Triggered externally by cron-job.org at 11:00 UTC daily.
    # GHA built-in schedule removed — it was unreliable (1-3h delays, skipped runs).

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secret
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Run FI Daily Brief
        run: python main.py
